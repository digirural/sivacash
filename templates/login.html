{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Sign In</h2>
    <p>Welcome back to Sivacash</p>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-primary">Sign In</button>

        <div style="margin-top: 15px; text-align: center;">
            <a href="{{ url_for('google_login') }}" class="btn-google"
                style="background: white; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 500; transition: transform 0.2s;">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"
                    style="width: 20px; height: 20px;">
                Sign in with Google
            </a>
        </div>
    </form>

    <div class="auth-footer">
        <a href="{{ url_for('forgot_password') }}" style="display: block; margin-bottom: 10px;">Forgot Password?</a>
        Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
    </div>
</div>
{% endblock %}
